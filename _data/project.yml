  - title: "DeepQC: AI Agent for Industrial Defect Analysis & Quality Control"
    images:
      - AI_Factory_Hackathon_2025.jpg
      - deepqc_poster.png
    aspect_ratio: "4/3"
    object_position: "top"
    slide: "DeepQC_Factory_Hack_Korea_Poster.pdf"
    detail: >
      <p>Developed <strong>DeepQC</strong>, an end-to-end <strong>multimodal AI agent system</strong> for automated defect classification, localization, and root-cause explanation across industrial manufacturing domains (capsules, leather, and tiles) at Factory Hack Korea 2025.</p>
      <p>Architected a modular 4-stage pipeline integrating robust data augmentation, <strong>SVM & YOLOv11</strong> for coarse-to-fine defect categorization, <strong>SegFormer</strong> for high-resolution binary defect segmentation, and <strong>Multimodal LLM (Qwen)</strong> prompting to generate human-interpretable natural language reports detailing defect position, morphology, and severity.</p>
    tags:
      - Multimodal AI
      - Computer Vision
      - LLM Agent
      - Quality Control
    description: >-
      Multimodal AI agent system integrating YOLOv11, SegFormer, and LLMs for industrial defect analysis and automated explanation (Factory Hack Korea 2025).
    id: deepqc_ai_agent

  - title: "GAA NS FET AC Performance Optimization & Device Design"
    image: GAA_NS_FET.png
    paper: "SNU_Problem6_duGAAza team.pdf"
    detail: >
      <p>Formulated a <strong>segmented analytical modeling framework</strong> to quantify resistance and parasitic capacitance components in sub-3nm <strong>GAA NS FET</strong> architectures against FinFET baselines, demonstrating a <strong>28% AC frequency gain (\(1/RC\))</strong>.</p>
      <p>Led comprehensive <strong>resistance breakdown</strong> (channel mobility, contact, spreading, and extension resistances) and parameter split optimization across 5 critical dimensions (nanosheet width, spacing, stack count, gate/spacer length) yielding an additional <strong>16% gain</strong>. Proposed and verified high-performance design alternatives—including <strong>PMOS Cladding eSiGe</strong>, <strong>Schottky-Barrier Engineering</strong>, and a novel <strong>CombFET</strong> hybrid geometry—via <strong>TCAD simulation</strong>.</p>
    tags:
      - Semiconductor
      - GAA NS FET
      - TCAD
      - Analytical Modeling
    description: >-
      Analytical impedance modeling and TCAD-based AC performance optimization for GAA NS FET (Top Prize, Deputy Prime Minister Award).
    id: gaa_ns_fet_optimization

  - title: "STOB League: Semiconductor Solverton Competition, Top Prize"
    image: solverton.jpg
    detail: >
      <p>Deputy Prime Minister and Education Minister Prize.</p>
      <p>Optimized AC performance of GAA NS FET via structural modeling and process-driven device design; analyzed resistance, capacitance, and frequency gain vs. FinFET; proposed enhanced design via TCAD.</p>
    tags:
